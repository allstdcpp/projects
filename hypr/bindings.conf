source = ./core.conf
source = ./waybar.conf

# Screen locking
bind = SUPER, L, exec, hyprlock

# Reload
bind = $meta, R, exec, $reload_waybar

# Applications
bindd = $meta, D, app launcher, exec, $menu
bindd = $meta, RETURN, Terminal, exec, $terminal
bindd = $meta, F, File manager, exec, $fileManager
bindd = $meta, B, Web browser, exec, $browser
bindd = $meta, N, Neovim, exec, $terminal -e nvim
bindd = $meta, T, Top, exec, $terminal -e htop
bindd = $meta, V, Video, exec, vlc

# Close windows
bindd = $meta SHIFT, Q, Close window, killactive,
bindd = $meta, Delete, exit Hyprland, exec, hyprctl dispatch exit 0

# Control tiling
bindd = $meta, J, Toggle window split, togglesplit, # dwindle
bindd = $meta, P, Pseudo window, pseudo, # dwindle
bindd = $meta SHIFT, V, Toggle window floating/tiling, togglefloating,
bindd = $meta, F11, Force full screen, fullscreen, 0
bindd = ALT, F11, Full width, fullscreen, 1

# Move focus with SUPER + arrow keys
bindd = $meta, LEFT, Move focus left, movefocus, l
bindd = $meta, RIGHT, Move focus right, movefocus, r
bindd = $meta, UP, Move focus up, movefocus, u
bindd = $meta, DOWN, Move focus down, movefocus, d

# Switch workspaces with SUPER + [0-9]
bindd = $meta, code:10, Switch to workspace 1, workspace, 1
bindd = $meta, code:11, Switch to workspace 2, workspace, 2
bindd = $meta, code:12, Switch to workspace 3, workspace, 3
bindd = $meta, code:13, Switch to workspace 4, workspace, 4
bindd = $meta, code:14, Switch to workspace 5, workspace, 5
bindd = $meta, code:15, Switch to workspace 6, workspace, 6
bindd = $meta, code:16, Switch to workspace 7, workspace, 7
bindd = $meta, code:17, Switch to workspace 8, workspace, 8
bindd = $meta, code:18, Switch to workspace 9, workspace, 9
bindd = $meta, code:19, Switch to workspace 10, workspace, 10

# Move active window to a workspace with SUPER + SHIFT + [0-9]
bindd = $meta SHIFT, code:10, Move window to workspace 1, movetoworkspace, 1
bindd = $meta SHIFT, code:11, Move window to workspace 2, movetoworkspace, 2
bindd = $meta SHIFT, code:12, Move window to workspace 3, movetoworkspace, 3
bindd = $meta SHIFT, code:13, Move window to workspace 4, movetoworkspace, 4
bindd = $meta SHIFT, code:14, Move window to workspace 5, movetoworkspace, 5
bindd = $meta SHIFT, code:15, Move window to workspace 6, movetoworkspace, 6
bindd = $meta SHIFT, code:16, Move window to workspace 7, movetoworkspace, 7
bindd = $meta SHIFT, code:17, Move window to workspace 8, movetoworkspace, 8
bindd = $meta SHIFT, code:18, Move window to workspace 9, movetoworkspace, 9
bindd = $meta SHIFT, code:19, Move window to workspace 10, movetoworkspace, 10

# TAB between workspaces
bindd = $meta, TAB, Next workspace, workspace, e+1
bindd = $meta SHIFT, TAB, Previous workspace, workspace, e-1
bindd = $meta CTRL, TAB, Former workspace, workspace, previous

# Cycle through applications on active workspace
bindd = ALT, TAB, Cycle to next window, cyclenext
bindd = ALT SHIFT, TAB, Cycle to prev window, cyclenext, prev
bindd = ALT, TAB, Reveal active window on top, bringactivetotop
bindd = ALT SHIFT, TAB, Reveal active window on top, bringactivetotop

# Resize active window
bindd = $meta, code:20, Expand window left, resizeactive, -100 0    # - key
bindd = $meta, code:21, Shrink window left, resizeactive, 100 0     # = key
bindd = $meta SHIFT, code:20, Shrink window up, resizeactive, 0 -100
bindd = $meta SHIFT, code:21, Expand window down, resizeactive, 0 100

# Scroll through existing workspaces with SUPER + scroll
bindd = $meta, MOUSE_DOWN, Scroll active workspace forward, workspace, e+1
bindd = $meta, MOUSE_UP, Scroll active workspace backward, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindmd = $meta, mouse:272, Move window, movewindow
bindmd = $meta, mouse:273, Resize window, resizewindow
